[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "green-miner"
version = "0.1.0"
description = "A miner for Green (GRN): a page in the browser that steers a node's GPU or CPU mining"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["green-grn @ https://github.com/ErtungaYusuf/green/archive/refs/heads/main.zip"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
green-miner = "green_miner.miner:main"

[tool.setuptools]
packages = ["green_miner"]

[tool.setuptools.package-data]
green_miner = ["miner.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
